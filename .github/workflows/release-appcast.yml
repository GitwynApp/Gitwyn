name: Publish Sparkle appcast

# When you publish a GitHub Release with a .dmg attached, this signs it with the
# Sparkle EdDSA key and rewrites appcast.xml on main, which is the app's update feed.
on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: appcast
  cancel-in-progress: false

jobs:
  appcast:
    runs-on: macos-14
    env:
      SPARKLE_VERSION: "2.9.4"   # keep in step with the Sparkle version the app links
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download the release's DMG(s)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          mkdir -p updates
          gh release download "$TAG" --repo "${{ github.repository }}" \
            --pattern '*.dmg' --dir updates
          # Carry existing entries forward so older versions stay in the feed.
          cp appcast.xml updates/appcast.xml 2>/dev/null || true

      - name: Fetch Sparkle CLI tools
        run: |
          set -euo pipefail
          curl -fsSL -o sparkle.tar.xz \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          mkdir sparkle && tar -xf sparkle.tar.xz -C sparkle

      - name: Write the EdDSA private key
        run: printf '%s' "${{ secrets.SPARKLE_PRIVATE_KEY }}" > eddsa_priv

      - name: Generate and sign the appcast
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          ./sparkle/bin/generate_appcast \
            --ed-key-file eddsa_priv \
            --download-url-prefix "https://github.com/${{ github.repository }}/releases/download/${TAG}/" \
            updates
          cp updates/appcast.xml appcast.xml

      - name: Remove the key
        if: always()
        run: rm -f eddsa_priv

      - name: Commit the updated appcast
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appcast.xml
          git commit -m "Update appcast for ${{ github.event.release.tag_name }}" || { echo "appcast unchanged"; exit 0; }
          git push origin main
